# Publish-rights ACL for the Health Hub MQTT design (docs/Claude-foundation.md §26.2):
# a device daemon may publish only to its own raw topic tree, the Hub may publish
# only to its own normalized `healthhub/...` tree, and every other client
# (Home Assistant, Node-RED, dashboards, scripts) is subscribe-only.
#
# Usernames below are examples — match them to whatever credentials you create
# in passwd (see mosquitto_passwd in README.md), one per daemon plus one for the Hub.

# Every authenticated client may read anything on the broker.
pattern read #

user trividia-truemetrix-daemon
topic write trividia-truemetrix/#

user viatom-o2ring-daemon
topic write viatom-o2ring/#

user etekcity-scale-daemon
topic write etekcity-scale/#

user etekcity-bp-daemon
topic write etekcity-bp/#

user health-thermometer-daemon
topic write health-thermometer/#

user healthhub
topic write healthhub/#
