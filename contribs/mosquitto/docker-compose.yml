services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: healthhub-mosquitto
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./config:/mosquitto/config:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log

volumes:
  mosquitto-data:
  mosquitto-log:
